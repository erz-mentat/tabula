</style></head><body>
<title>Cursus</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Kopfleiste mit Wochensteuerung; darunter links das Wochenraster (Zeitachse + sieben Tagesspalten), rechts die Seitenleiste mit Wochensoll und Warteschlangen. Auf schmalen Bildschirmen ein Tag mit Tagesreitern, Seitenleiste darunter. */
:root {
  /* Gleiche Palette und Schriften wie Aude: Grau, Off-White, Türkis */
  --bg: #e9e8e4;
  --surface: #f3f2ee;
  --surface-2: #dcdbd7;
  --ink: #1b1c1f;
  --muted: #55565a;
  --line: #b5b2aa;
  --accent: #17708f;
  --accent-ink: #ffffff;
  --danger: #a8322c;
  --now: #c2402c;
  --hatch: rgba(27, 28, 31, .08);
  --scrim: rgba(20, 21, 23, .42);
  --mix: 20%;
  /* Farben der Google-Kalender-Farbpalette, damit Blöcke hier und in Google gleich aussehen */
  /* Terminfarben in Erdtönen, gleiche Reihenfolge wie Google (1 Lavendel … 11 Tomate) */
  --g1: #8a7ba3; --g2: #7d9758; --g3: #845073; --g4: #c27766; --g5: #c4952f; --g6: #b85a2a; --g7: #4d8794; --g8: #7b6f62; --g9: #57618c; --g10: #5a7537; --g11: #a3362a;
  --f-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --f-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --pph: 44px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1e21; --surface: #242528; --surface-2: #2e2f33; --ink: #f3f0ea; --muted: #cbc6bc;
    --line: #5d5b57; --accent: #8b6cef; --accent-ink: #ffffff; --danger: #ef6b6b; --now: #ff7a6a;
    --hatch: rgba(243, 240, 234, .07); --scrim: rgba(0, 0, 0, .6); --mix: 26%;
    --g1: #a597bd; --g2: #9bb575; --g3: #a8719a; --g4: #d9917f; --g5: #d8ae52; --g6: #d5774a; --g7: #6ea6b2; --g8: #9a8e80; --g9: #7b86b3; --g10: #7f9a57; --g11: #cc5b4b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"], :root[data-in-daimonion] {
  --bg: #1d1e21; --surface: #242528; --surface-2: #2e2f33; --ink: #f3f0ea; --muted: #cbc6bc;
  --line: #5d5b57; --accent: #8b6cef; --accent-ink: #ffffff; --danger: #ef6b6b; --now: #ff7a6a;
  --hatch: rgba(243, 240, 234, .07); --scrim: rgba(0, 0, 0, .6); --mix: 26%;
    --g1: #a597bd; --g2: #9bb575; --g3: #a8719a; --g4: #d9917f; --g5: #d8ae52; --g6: #d5774a; --g7: #6ea6b2; --g8: #9a8e80; --g9: #7b86b3; --g10: #7f9a57; --g11: #cc5b4b;
  color-scheme: dark;
}
@media (max-width: 760px) { :root { --pph: 52px; } }

body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 40px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }

/* Kopfleiste */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 12px; }
.brand h1 { font-family: var(--f-display); font-weight: 600; font-size: 36px; line-height: 1; margin: 0; letter-spacing: .005em; }
.brand .kw { font-family: var(--f-mono); font-size: 12px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.nav { display: flex; align-items: center; gap: 6px; }
.nav .range { font-family: var(--f-display); font-size: 20px; font-weight: 500; min-width: 0; padding-inline: 6px; text-wrap: balance; }
.acts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
.status { font-size: 12px; color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; min-height: 36px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.icon { min-width: 36px; padding: 6px 0; font-size: 18px; line-height: 1; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--muted); }
.btn.quiet:hover { color: var(--ink); border-color: var(--line); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: var(--surface); border-color: var(--danger); }
.btn[disabled] { opacity: .5; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.cmd { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.cmd-lab { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.cmd-row { display: flex; gap: 8px; flex-wrap: wrap; }
.cmd-row input { flex: 1 1 260px; min-width: 0; font-size: 15px; }
.cmd-out { font-size: 13px; line-height: 1.5; white-space: pre-wrap; border-top: 1px solid var(--line); padding-top: 8px; }
.cmd-out .act { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); display: block; }
.load { margin: 0 0 8px; font-size: 12.5px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); }
.load.ok { color: var(--muted); }
.load.short { border-color: var(--danger); color: var(--ink); }
.banner { margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--danger); border-radius: 8px; }
.banner p { margin: 0; flex: 1 1 280px; min-width: 0; }

/* Grundraster */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 20px; margin-top: 16px; align-items: start; }
@media (max-width: 1120px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.planbox { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: clip; min-width: 0; }
.tabs { display: none; gap: 6px; overflow-x: auto; padding: 10px 10px 0; }
.tab { flex: 1 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; line-height: 1.15; }
.tab b { font-family: var(--f-display); font-size: 18px; font-weight: 600; }
.tab span { font-size: 11px; color: var(--muted); }
.tab.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.tab.today b { color: var(--accent); }

.heads, .body { display: grid; grid-template-columns: 52px repeat(7, minmax(0, 1fr)); }
.heads { border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; }
.head { padding: 8px 8px 7px; border-left: 1px solid var(--line); min-width: 0; }
.head .dl { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.head .d { font-family: var(--f-display); font-weight: 600; font-size: 22px; line-height: 1; }
.head .lat { font-family: var(--f-display); font-style: italic; font-size: 13px; color: var(--muted); white-space: nowrap; }
.head.today .d { color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.chip { font-size: 11px; line-height: 1.2; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button.chip { cursor: pointer; }
.chip.tog[aria-pressed="false"] { background: transparent; border-style: dashed; }
.chip.hol { color: var(--ink); border-color: var(--muted); }
.chip.ext { color: var(--ink); }
.chip.wx { background: transparent; font-family: var(--f-mono); font-size: 10.5px; }
.chip.wx.wet { color: var(--ink); border-color: var(--g7); background: color-mix(in srgb, var(--g7) 16%, var(--surface)); }
.chip.geb { color: var(--ink); border-color: var(--g11); background: color-mix(in srgb, var(--g11) 12%, var(--surface)); font-weight: 600; }
.bd { list-style: none; margin: 0; padding: 0; }
.bd li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.bd li b { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd li .mono { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.bd li.soon b { color: var(--ink); font-weight: 600; }
.mini.armed { color: var(--danger); border-color: var(--danger); width: auto; padding-inline: 6px; }

.axis { position: relative; height: calc(var(--pph) * 17); }
.axis span { position: absolute; right: 7px; transform: translateY(-50%); font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.axis span:first-child { transform: none; }
.col { position: relative; height: calc(var(--pph) * 17); border-left: 1px solid var(--line); background-image: linear-gradient(var(--line) 1px, transparent 1px); background-size: 100% var(--pph); cursor: copy; }
.col.past { background-color: color-mix(in srgb, var(--surface-2) 45%, transparent); }

.blk { position: absolute; box-sizing: border-box; display: flex; flex-direction: column; align-items: stretch; text-align: left; gap: 1px; padding: 3px 6px 3px 8px; border-radius: 6px; border: 1px solid transparent; overflow: hidden; font-size: 12px; line-height: 1.25; cursor: pointer; min-width: 0; }
.blk .tm { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
.blk .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .s { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk.sm { flex-direction: row; align-items: center; gap: 6px; padding-block: 1px; }
.blk.sm .s { display: none; }
.blk.plan { background: color-mix(in srgb, var(--c) var(--mix), var(--surface)); border-left: 3px solid var(--c); }
.blk.plan:hover { background: color-mix(in srgb, var(--c) calc(var(--mix) + 8%), var(--surface)); }
.blk.done { opacity: .55; }
.blk.done .t::before { content: "✓ "; }
.blk.ext { background: var(--surface-2); border-left: 3px solid var(--muted); }
.blk.sugg { background: color-mix(in srgb, var(--c) 7%, var(--surface)); border: 1.5px dashed var(--c); }
.blk.sugg .tm { color: var(--ink); }
.blk.sugg.opt { border-style: dotted; background: transparent; opacity: .85; }
.blk.frame { padding: 4px 0 0 2px; background: color-mix(in srgb, var(--c) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); border-left: 3px solid var(--c); z-index: 0; }
.blk.frame.fsugg { border-style: dashed; border-left-style: solid; background: color-mix(in srgb, var(--c) 5%, var(--surface)); }
.blk.frame .fl-lab { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10.5px; font-weight: 600; color: color-mix(in srgb, var(--c) 70%, var(--ink)); white-space: nowrap; overflow: hidden; max-height: 100%; align-self: flex-start; }
.blk.frame:hover { background: color-mix(in srgb, var(--c) 15%, var(--surface)); }
.col > .blk:not(.frame) { z-index: 1; }
.chip.test { color: var(--ink); border-color: var(--g11); font-weight: 600; background: transparent; }
.blk.school { cursor: default; color: var(--muted); background: repeating-linear-gradient(135deg, var(--hatch) 0 6px, transparent 6px 12px), var(--surface-2); }
.blk.school .t { font-weight: 500; }
.blk.school.exam { border: 1.5px solid var(--danger); color: var(--ink); }
.now { position: absolute; left: 0; right: 0; border-top: 2px solid var(--now); z-index: 3; pointer-events: none; }
.now::before { content: ""; position: absolute; left: -4px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--now); }

.loading-note { position: absolute; inset: 40% 8px auto; text-align: center; color: var(--muted); font-size: 13px; pointer-events: none; }

/* Ein-Tages-Ansicht */
.planbox.single .tabs { display: flex; }
.planbox.single .heads, .planbox.single .body { grid-template-columns: 52px minmax(0, 1fr); }
.planbox.single .head:not(.on), .planbox.single .col:not(.on) { display: none; }

/* Seitenleiste */
.side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
@media (min-width: 1121px) { .side { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; } }
.side .panel[data-tab] { display: none; }
.side[data-tab="soll"] .panel[data-tab="soll"], .side[data-tab="q"] .panel[data-tab="q"], .side[data-tab="task"] .panel[data-tab="task"], .side[data-tab="test"] .panel[data-tab="test"], .side[data-tab="geb"] .panel[data-tab="geb"] { display: block; }
.stabs { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; position: sticky; top: 0; z-index: 2; }
.stab { flex: 1 1 auto; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 6px 4px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.stab span { font-size: 11px; color: var(--accent); }
.stab.on { background: var(--raise, var(--bg)); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.seen.more summary { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 16px; min-width: 0; }
.panel h2 { font-family: var(--f-display); font-weight: 600; font-size: 24px; line-height: 1.1; margin: 0; }
.panel .ph { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
.eyebrow:first-of-type { margin-top: 2px; }
.dot { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }

.soll { display: flex; flex-direction: column; gap: 2px; }
.srow { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto auto; align-items: center; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); }
.srow:last-child { border-bottom: 0; }
.srow .nm { min-width: 0; }
.srow .nm b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .nm small { display: block; color: var(--muted); font-size: 11px; }
.pips { display: flex; flex-wrap: wrap; gap: 3px; justify-content: flex-end; max-width: 96px; }
.pip { width: 9px; height: 9px; border-radius: 2px; border: 1.5px solid color-mix(in srgb, var(--c) 70%, var(--muted)); box-sizing: border-box; }
.pip.set { background: var(--c); border-color: var(--c); }
.pip.sug { border-style: dashed; background: color-mix(in srgb, var(--c) 25%, transparent); }
.step { display: flex; align-items: center; gap: 2px; }
.step button { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; line-height: 1; }
.step span { min-width: 18px; text-align: center; }

.lec { display: flex; flex-direction: column; gap: 5px; padding: 6px 0 8px; }
.lec-h { display: flex; align-items: center; gap: 8px; }
.lec-h b { font-weight: 600; flex: 1; min-width: 0; }
.lec-h .mono { font-size: 12px; color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--c); }

.yt { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.yt li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto auto auto; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.yt li .n { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.yt li a { color: var(--ink); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.yt li a:hover { text-decoration: underline; }
.yt li .mono { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.mini { width: 26px; height: 26px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--muted); cursor: pointer; }
.mini:hover { border-color: var(--line); color: var(--ink); }
.seen { margin-top: 6px; font-size: 12px; color: var(--muted); }
.seen ul { margin: 6px 0 0; padding-left: 18px; }

.form { display: grid; gap: 6px; margin-top: 10px; }
.form .row { display: flex; gap: 6px; flex-wrap: wrap; }
.form .row > * { min-width: 0; }
label.fl { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
input[type="text"], input[type="url"], input[type="number"], input[type="time"], select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-height: 34px; box-sizing: border-box; width: 100%; }
input[type="number"] { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

/* Blatt (Dialog) */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; display: flex; align-items: flex-end; justify-content: center; padding-top: env(safe-area-inset-top, 0px); }
.sheet { background: var(--surface); color: var(--ink); width: min(560px, 100%); max-height: 86vh; overflow: auto; box-sizing: border-box; border-radius: 14px 14px 0 0; padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); box-shadow: 0 -8px 30px rgba(0,0,0,.18); }
@media (min-width: 761px) { .scrim { align-items: center; } .sheet { border-radius: 14px; } }
.sheet h3 { font-family: var(--f-display); font-weight: 600; font-size: 26px; line-height: 1.1; margin: 2px 0 4px; text-wrap: balance; }
.sheet .sub { color: var(--muted); margin: 0 0 12px; }
.sheet .acts2 { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.sheet .acts2 .grow { flex: 1; }
.types { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 10px; }
.types button { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; background: var(--surface); cursor: pointer; }
.types button[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) var(--mix), var(--surface)); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.settings-tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.settings-tbl th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 4px 4px; }
.settings-tbl td { padding: 3px 4px; border-top: 1px solid var(--line); }
.settings-tbl td:first-child { white-space: nowrap; }
.tblwrap { overflow-x: auto; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--surface); padding: 9px 14px; border-radius: 8px; max-width: min(520px, calc(100% - 32px)); box-sizing: border-box; font-size: 13px; }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .18s ease-out; } @keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } } }

/* Seit Tabula XLVII (David 27.11.2026: „viel zu bunt … Lilatöne, Grau, Weiß, eine Farbe im Kontrast“). Eine Farbfamilie statt elf Farben:
   Denkarbeit in Lila (hell bis tief), Lesen in Weiß und Hellgrau, Orte in Stahl, und Bernstein als einzige Gegenfarbe für das, was heraussticht
   (Gym, Tests, die Jetzt-Linie). XLVI hatte denselben Versuch, stand aber im falschen Stilblock und wirkte nicht. */
:root[data-theme="dark"], :root[data-in-daimonion], :root:not([data-theme="light"]) {
  --mix: 11%; --line: #3d3e43; --now: #f0b54a;

<script>
(() => {
"use strict";
const SERVER = "Google Calendar";
const HOLI = "de.german#holiday@group.v.calendar.google.com";
const H0 = 7, H1 = 24;
const DSHORT = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
const DLONG = ["Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag", "Sonntag"];
const DLAT = ["Lunae", "Martis", "Mercurii", "Iovis", "Veneris", "Saturni", "Solis"];
const MON = ["Jan", "Feb", "März", "Apr", "Mai", "Juni", "Juli", "Aug", "Sep", "Okt", "Nov", "Dez"];
const TYPE_ORDER = ["gt", "lern", "fokus", "bib", "gym", "va", "vb", "yt", "sach", "abend"];

const RANK = { bib: [3, 1, 1, 1, 3, 0, 9], gym: [0, 2, 1, 2, 0, 1, 3], gymBib: [1, 0, 0, 0, 1, 1, 2], lern: [1, 0, 0, 0, 1, 2, 3] };
const META = {
  lern: { label: "Lernzeit", color: "9" }, fokus: { label: "Fokusphase", color: "3" },
  bib: { label: "Bibliothek", color: "10" }, gym: { label: "Gym", color: "6" },
  va: { label: "Vorlesung A", color: "7" }, vb: { label: "Lektüre", color: "1" },
  yt: { label: "YouTube", color: "4" }, sach: { label: "Primärbuch", color: "2" },
  abend: { label: "Sekundärbuch", color: "5" }, geb: { label: "Geburtstag", color: "11" },
  test: { label: "Test", color: "11" }, gt: { label: "Spieltheorie", color: "8" }, task: { label: "Aufgabe", color: "11" }
};
/* Blöcke, die auch innerhalb der Bibliothekszeit laufen dürfen, und Höchstzahl pro Tag */
const INNER = { gt: true, lern: true, va: true, vb: true, yt: true };
const PERDAY = { gt: 2, lern: 1, fokus: 1, va: 2, vb: 2, yt: 2, sach: 1 };
const DEFAULT_STORE = {
  settings: {
    weekendStart: "08:00", dayEnd: "23:00", afterSchool: 30, buffer: 15,
    school: { "0": ["08:15", "15:15"], "1": ["08:15", "13:15"], "2": ["08:15", "13:15"], "3": ["08:15", "13:15"], "4": ["08:15", "15:15"] },
    schoolOff: {},
    walk: { bib: 30, bibGym: 15, gym: 30 }, rainLimit: 50, wx: {}, skip: {},
    lunch: { from: "12:00", to: "16:30", dur: 45 }, lecturesPerWeek: 9, lectureFirst: "vb", remind: 5
  },
  types: {
    lern: { dur: 90, perWeek: 4, from: "14:00", to: "21:00" },
    fokus: { dur: 90, perWeek: 5, from: "19:00", to: "23:00" },
    bib: { dur: 180, perWeek: 3, from: "10:00", to: "20:00", sundayFixed: true },
    gym: { dur: 90, perWeek: 2, from: "10:00", to: "21:30" },
    va: { dur: 60, perWeek: 3, from: "17:00", to: "22:30" },
    vb: { dur: 60, perWeek: 2, from: "17:00", to: "22:30" },
    yt: { dur: 60, perWeek: 6, from: "19:00", to: "23:00" },
    sach: { dur: 45, perWeek: 6, from: "08:00", to: "23:00" },
    abend: { dur: 45, fixed: "23:00" },
    gt: { dur: 120, perWeek: 2, from: "08:00", to: "21:00", optional: 1 }
  },
  lectures: { va: { name: "", total: 0, sid: "a0" }, vb: { name: "", total: 0, sid: "b0" } },
  yt: [],
  gt: [],
  gtDoc: "",
  tasks: [],
  books: { sach: "", abend: "" },
  birthdays: [],
  tests: [],
  done: {}
};
// Öffentliche Fassung: neutraler Start ohne Davids Alltag
if (window.__PUBLICA__) {
  Object.assign(META.gym, { label: "Sport" }); Object.assign(META.va, { label: "Kurs" }); Object.assign(META.yt, { label: "Videos" }); Object.assign(META.sach, { label: "Lesen" }); Object.assign(META.abend, { label: "Abendlektüre" }); Object.assign(META.gt, { label: "Projekt" });
  const s = DEFAULT_STORE.settings; s.school = {}; s.walk = { bib: 0, bibGym: 0, gym: 0 }; s.lecturesPerWeek = 0;
  for (const t of Object.values(DEFAULT_STORE.types)) { t.perWeek = 0; delete t.sundayFixed; delete t.optional; }
}

/* ---------- Hilfsfunktionen ---------- */
const $ = s => document.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const mondayOf = d => { const x = dayStart(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
const toMin = s => { const [h, m] = String(s || "0:0").split(":").map(Number); return (h || 0) * 60 + (m || 0); };
const hhmm = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const ceil15 = m => Math.ceil(m / 15) * 15;
const minOfDay = d => d.getHours() * 60 + d.getMinutes();
const localISO = (d, min) => `${ymd(d)}T${hhmm(min)}:00`;
const dateAt = (d, min) => new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, min);
const ymdToDate = s => { const [y, m, d] = s.slice(0, 10).split("-").map(Number); return new Date(y, m - 1, d); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rid = () => Math.random().toString(36).slice(2, 10);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmtH = h => { const r = Math.round(h * 2) / 2; const w = Math.floor(r); return r % 1 ? (w ? w + "½" : "½") : String(w); };
const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const wd = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - wd); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); };
function merge(base, over) {
  if (over === undefined || over === null) return base;
  if (typeof over !== "object" || Array.isArray(over) || typeof base !== "object" || base === null || Array.isArray(base)) return over;
  const out = { ...base };
  for (const k of Object.keys(over)) out[k] = merge(base[k], over[k]);
  return out;
}
const use = n => TW.use(n);

/* ---------- Zustand ---------- */
const S = {
  store: clone(DEFAULT_STORE), storeLoaded: false, ref: null, dbOff: false, writes: Promise.resolve(),
  mcp: null, calErr: null, eventsLoaded: false, loading: false, loadedAt: null,
  weekStart: mondayOf(new Date()), events: [], holidays: {}, weather: null,
  sugg: [], short: {}, labels: {}, rejected: new Set(),
  activeDay: (new Date().getDay() + 6) % 7, single: false, busy: false, sheet: null
};

const typeLabel = t => (t === "va" || t === "vb") ? (S.store.lectures[t].name || META[t].label) : META[t].label;
const colorVar = t => `var(--g${(META[t] || { color: "8" }).color})`;
/* Vergangene Blöcke gelten automatisch als erledigt, außer sie wurden als „nicht gemacht“ markiert */
const AUTO_SKIP = ["geb", "test", "abend", "bib"];
const isDone = ev => { const d = S.store.done[ev.id]; if (d && d.skipped) return false; return !!d || /^✓/.test(ev.title) || (!!ev.type && !ev.allDay && ev.end <= new Date()); };
function autoDone(events) {
  if (!S.storeLoaded || !S.ref) return false;
  const now = new Date();
  const list = events.filter(e => e.type && !AUTO_SKIP.includes(e.type) && !e.allDay && e.end <= now && !S.store.done[e.id]).sort((a, b) => a.end - b.end);
  for (const ev of list) {
    const min = Math.round((ev.end - ev.start) / 60000), entry = { slot: ev.type, min, at: +ev.end, auto: true };
    if (queueOf(ev.type)) {
      let need = min; const alloc = [];
      for (const it of ytQueue(queueOf(ev.type)).filter(i => i.rest > 0)) { if (need <= 0) break; const take = Math.min(need, it.rest); alloc.push([it.id, take]); need -= take; }
      entry.alloc = alloc;
    }
    if (ev.type === "va" || ev.type === "vb") entry.sid = S.store.lectures[ev.type].sid;
    if (ev.type === "task" && ev.taskId) { const t = (S.store.tasks || []).find(x => x.id === ev.taskId); if (t) t.done = true; }
    S.store.done[ev.id] = entry;
  }
  return list.length > 0;
}
const cleanTitle = t => String(t || "").replace(/^✓\s*/, "");

function parseEvent(ev) {
  if (!ev || ev.status === "cancelled" || !ev.start) return null;
  const allDay = !!(ev.start.date && !ev.start.dateTime);
  const start = allDay ? ymdToDate(ev.start.date) : new Date(ev.start.dateTime);
  const end = allDay ? ymdToDate((ev.end && ev.end.date) || ev.start.date) : new Date((ev.end && ev.end.dateTime) || ev.start.dateTime);
  const m = /\[tagwerk:([a-z]+)\]/.exec(ev.description || "");
  const type = m && META[m[1]] ? m[1] : null;
  const tm = /aufgabe:([\w-]+)/.exec(ev.description || "");
  return { id: ev.id, title: ev.summary || "(ohne Titel)", start, end, allDay, transparent: ev.transparency === "transparent", type, desc: ev.description || "", link: ev.htmlLink || "", birthday: ev.eventType === "BIRTHDAY" || type === "geb", taskId: tm ? tm[1] : null };
}
const walkDay = i => i !== 6;
function wxFor(key) {
  const set = S.store.settings, o = set.wx && set.wx[key];
  const w = S.weather && S.weather.days ? S.weather.days[key] : null;
  const lim = +set.rainLimit || 50;
  if (o === "wet") return { wet: true, manual: true, w };
  if (o === "dry") return { wet: false, manual: true, w };
  if (w) return { wet: (+w.pop || 0) >= lim, manual: false, w };
  return { wet: false, manual: false, w: null };
}
/* Mittagspause an schulfreien Tagen: wird nach Bibliothek und Gym in die erste freie Lücke im Mittagsfenster gelegt */
function lunchOf(i, date) { return (S.lunchAt && S.lunchAt[ymd(date)]) || null; }
/* Nächster Test innerhalb von drei Tagen nach diesem Datum */
function testAhead(date) {
  const k0 = ymd(date), k3 = ymd(addDays(date, 3));
  const list = (S.store.tests || []).filter(t => t.date > k0 && t.date <= k3).sort((a, b) => a.date.localeCompare(b.date));
  if (!list.length) return null;
  const t = list[0], days = Math.round((ymdToDate(t.date) - dayStart(date)) / 864e5);
  return { subject: t.subject, when: days === 1 ? "morgen" : DLONG[(ymdToDate(t.date).getDay() + 6) % 7] };
}
function skipped(key, type) { const s = S.store.settings.skip && S.store.settings.skip[key]; return Array.isArray(s) && s.includes(type); }
function nextOcc(dateStr) {
  const [, m, d] = String(dateStr).slice(0, 10).split("-").map(Number);
  const t0 = dayStart(new Date());
  let n = new Date(t0.getFullYear(), m - 1, d);
  if (n < t0) n = new Date(t0.getFullYear() + 1, m - 1, d);
  return n;
}
function segmentsForDay(ev, date) {
  const ds = dayStart(date), de = addDays(ds, 1);
  if (ev.end <= ds || ev.start >= de) return null;
  const s = ev.start < ds ? 0 : minOfDay(ev.start);
  const e = ev.end >= de ? 1440 : minOfDay(ev.end);
  return e > s ? [s, e] : (ev.allDay ? [0, 1440] : null);
}
function schoolOf(i, date) {
  if (i > 4) return null;
  const key = ymd(date);
  if (S.store.settings.schoolOff[key]) return null;
  if (S.holidays[key] && S.holidays[key].free) return null;
  const ex = (S.store.settings.schoolEx || {})[key];
  const t = ex || S.store.settings.school[String(i)];
  if (!t || !t[0] || !t[1]) return null;
  return [toMin(t[0]), toMin(t[1])];
}

/* ---------- Warteschlangen ---------- */
function ytConsumed() {
  const c = {};
  for (const e of Object.values(S.store.done)) if (e && e.alloc) for (const [id, m] of e.alloc) c[id] = (c[id] || 0) + m;
  return c;
}
const queueOf = type => (type === "yt" || type === "gt") ? type : (((S.store.lectures || {})[type] || {}).queue || null);
function ytQueue(list) {
  const c = ytConsumed();
  return (S.store[list || "yt"] || []).map(it => ({ ...it, rest: Math.max(0, (+it.min || 0) - (c[it.id] || 0)) }));
}
function lessonsOf(i, date) {
  const set = S.store.settings, L = (set.ttEx || {})[ymd(date)] || (set.timetable || {})[String(i)];
  if (!L || !L.length) return null;
  return L.map(l => ({ s: toMin(l[0]), e: toMin(l[1]), t: l[2] || "", sub: l[3] || "", test: !!l[4] }));
}
function lectureRemain(slot) {
  const L = S.store.lectures[slot]; let used = 0;
  for (const e of Object.values(S.store.done)) if (e && e.slot === slot && e.sid === L.sid) used += e.min || 0;
  return Math.max(0, (+L.total || 0) - used / 60);
}
function plannedFutureMin(type) {
  const now = new Date(); let m = 0;
  for (const ev of S.events) if (ev.type === type && !isDone(ev) && ev.end > now) m += (ev.end - ev.start) / 60000;
  return m;
}
function capacity() {
  const st = S.store, cap = {};
  for (const slot of ["va", "vb"]) {
    const rem = lectureRemain(slot) * 60 - plannedFutureMin(slot);
    cap[slot] = Math.max(0, Math.ceil(rem / Math.max(15, +st.types[slot].dur || 60)));
    const L = st.lectures[slot];
    if (L && L.perWeek != null && S.weekStart) {
      const ws = S.weekStart, we = addDays(S.weekStart, 7);
      const n = S.events.filter(e => e.type === slot && e.start >= ws && e.start < we).length;
      cap[slot] = Math.min(cap[slot], Math.max(0, +L.perWeek - n));
    }
  }
  const ytRest = ytQueue().reduce((a, i) => a + i.rest, 0) - plannedFutureMin("yt");
  cap.yt = Math.max(0, Math.ceil(ytRest / Math.max(15, +st.types.yt.dur || 60)));
  return cap;
}
function upcoming(type, extra) {
  const now = new Date();
  const evs = S.events.filter(e => e.type === type && !isDone(e) && e.end > now).map(e => ({ key: "e:" + e.id, start: e.start, min: (e.end - e.start) / 60000 }));
  const sg = S.sugg.filter(s => s.type === type).map(s => ({ key: "s:" + s.key, start: s.startDate, min: s.dur }));
  const ex = (extra || []).filter(x => x.type === type);
  return [...evs, ...sg, ...ex].sort((a, b) => a.start - b.start);
}
/* Link auf die Stelle, an der es weitergeht: bereits geschaute Minuten auf die Startzeit des Links aufschlagen */
function atOffset(url, add) {
  if (!(add > 0) || !/youtube\.com|youtu\.be/.test(url)) return url;
  const m = url.match(/[?&]t=(\d+)s?/), base = m ? +m[1] : 0, t = base + Math.round(add);
  return m ? url.replace(/([?&])t=\d+s?/, `$1t=${t}s`) : url + (url.includes("?") ? "&" : "?") + `t=${t}s`;
}
function computeLabels(extra) {
  const L = {};
  for (const qt of ["yt", "gt"]) {
  const q = ytQueue(qt).filter(i => i.rest > 0).map(i => ({ ...i }));
  for (const b of upcoming(qt, extra)) {
    let need = b.min; const parts = []; const urls = [];
    while (need > 0 && q.length) {
      const it = q[0], before = it.rest, take = Math.min(need, it.rest);
      parts.push({ title: it.title, take, before, whole: +it.min || before });
      if (it.url) urls.push(atOffset(it.url, ((+it.min || before) - before) * 60));
      it.rest -= take; need -= take;
      if (it.rest <= 0) q.shift();
    }
    L[b.key] = parts.length
      ? { title: parts.map(p => p.title).join(" + "), sub: parts.map(p => (p.take < p.before || p.before < p.whole) ? `${p.take} von ${p.before} min` : `${p.take} min`).join(" · "), urls, ids: parts }
      : { title: qt === "gt" ? "Plan leer" : "Liste leer", sub: qt === "gt" ? "Nächsten Schritt in der Seitenleiste eintragen" : "Videos in der Seitenleiste hinzufügen", urls: [] };
  }
  }
  for (const slot of ["va", "vb"]) {
    let rem = lectureRemain(slot);
    const qn = queueOf(slot), q = qn ? ytQueue(qn).filter(i => i.rest > 0).map(i => ({ ...i })) : [];
    for (const b of upcoming(slot, extra)) {
      const sub = rem > 0 ? `noch ${fmtH(rem)} h offen` : "Reihe abgeschlossen";
      /* Reihe mit Leseliste: der Block nennt den konkreten Text und verlinkt ihn */
      let need = b.min; const parts = [], urls = [];
      while (qn && need > 0 && q.length) {
        const it = q[0], before = it.rest, take = Math.min(need, it.rest);
        parts.push(it.title); if (it.url) urls.push(it.url);
        it.rest -= take; need -= take; if (it.rest <= 0) q.shift();
      }
      L[b.key] = parts.length ? { title: typeLabel(slot), qtitle: parts.join(" + "), sub, urls } : { title: typeLabel(slot), sub };
      rem = Math.max(0, rem - b.min / 60);
    }
  }
  const tasks = S.store.tasks || [];
  const tLab = id => { const t = tasks.find(x => x.id === id); return t ? { title: t.title, sub: `fällig ${dueText(t)}`, taskId: t.id } : null; };
  for (const s of S.sugg) if (s.type === "task") L["s:" + s.key] = tLab(s.taskId);
  for (const e of S.events) if (e.type === "task" && e.taskId) L["e:" + e.id] = tLab(e.taskId);
  return L;
}
function dueText(t) {
  const d = ymdToDate(t.due);
  return `${DSHORT[(d.getDay() + 6) % 7]} ${d.getDate()}. ${MON[d.getMonth()]}${t.dueTime ? ", " + t.dueTime : ""}`;
}

/* ---------- Lückenvorschläge ---------- */
/* Freier Platz: Block [t, t+dur] mit Vorlauf pre (z. B. Fußweg hin) und Nachlauf post (Fußweg zurück).
   Zwischen zwei Blöcken liegt mindestens der größere Weg bzw. die Pause zwischen Blöcken. */
function findSlot(day, from, to, dur, pre, post, ok, ignore) {
  /* ignore: ein Bibliotheksrahmen, in den der Block hineingelegt wird */

/* ---------- Spiegel für Aude ----------
   Cursus legt einen kompakten Stand seiner Planungsregeln in einen versteckten Kalendereintrag am 1.1.2000.
   Aude (Davids Agent auf dem Mac) liest ihn dort, weil es an Cursus' eigenen Speicher nicht herankommt. */

function mirrorDigest() {

    types: st.types, lectures: lect, tests: (st.tests || []).filter(t => t.date >= today).map(t => ({ date: t.date, subject: t.subject })),
    tasks: (st.tasks || []).filter(t => !t.done).map(t => ({ title: t.title, min: t.min, due: t.due })) };

      const hit = ((p && p.events) || []).find(e => String(e.description || "").startsWith(MIRROR_TAG));

      catch (e) { if (e && e.code === "tool_error") id = null; else throw e; }
    }

      const p = await call("create_event", { summary: "Cursus · Stand für Aude (nicht löschen)", startTime: "2000-01-01T00:00:00", endTime: "2000-01-02T00:00:00",

}

function loadHtml() {

    s.buffer = Math.max(0, num("#s-buf", s.buffer));
    s.walk = { bib: Math.max(0, num("#w-bib", 30)), bibGym: Math.max(0, num("#w-bg", 15)), gym: Math.max(0, num("#w-gym", 30)) };
    s.rainLimit = Math.min(100, Math.max(5, num("#w-rain", 50)));
    st.types.bib.sundayFixed = $("#s-sun").checked;
    closeSheet(); persist(); recompute(); render(); toast("Einstellungen gespeichert.");
  }
};
function weekChanged() {
  const cur = mondayOf(new Date());
  S.activeDay = +S.weekStart === +cur ? (new Date().getDay() + 6) % 7 : 0;
  S.events = []; S.holidays = {}; S.eventsLoaded = false; S.rejected.clear();
  recompute(); render(); loadWeek();
}
function normalizeYt(raw) {
  const s = raw.trim();
  let id = null, m;
  if ((m = /duck:\/\/player\/([\w-]{6,})/.exec(s))) id = m[1];
  else if ((m = /youtu\.be\/([\w-]{6,})/.exec(s))) id = m[1];
  else if ((m = /[?&]v=([\w-]{6,})/.exec(s))) id = m[1];
  else if ((m = /youtube\.com\/(?:shorts|live|embed)\/([\w-]{6,})/.exec(s))) id = m[1];
  else if (/^[\w-]{11}$/.test(s)) id = s;
  if (!id) return null;
  const t = /[?&]t=(\d+)/.exec(s);
  return { id, url: `https://www.youtube.com/watch?v=${id}${t ? `&t=${t[1]}s` : ""}` };
}

document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (a && A[a.dataset.act]) { e.preventDefault(); A[a.dataset.act](a, e); return; }
  if (e.target === $("#scrim")) { closeSheet(); return; }
  const col = e.target.closest(".col");
  if (col && !e.target.closest(".blk")) {
    if (!S.mcp || !S.eventsLoaded || S.busy) { toast("Der Kalender ist noch nicht geladen."); return; }
    const r = col.getBoundingClientRect();
    const pph = r.height / (H1 - H0);
    const min = H0 * 60 + Math.floor(((e.clientY - r.top) / pph) * 4) * 15;
    sheetQuickAdd(+col.dataset.day, min);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sheet) closeSheet(); });
document.addEventListener("submit", e => {
  const f = e.target.closest("[data-form]"); if (!f) return;
  e.preventDefault();
  if (f.dataset.form === "yt") {
    const n = normalizeYt($("#yt-url").value);
    if (!n) { toast("Das sieht nicht nach einem YouTube-Link aus."); return; }
    const title = $("#yt-title").value.trim() || `Video ${n.id}`;
    const min = Math.max(5, +$("#yt-min").value || 60);
    S.store.yt.push({ id: rid(), title, url: n.url, min });
    persist(); recompute(); render(); toast("Video hinzugefügt.");
  }
  if (f.dataset.form === "task") {
    const title = $("#task-title").value.trim(), due = $("#task-due").value, tim = $("#task-time").value;
    const min = Math.max(15, +$("#task-min").value || 60);
    if (!title || !/^\d{4}-\d{2}-\d{2}$/.test(due)) { toast("Gib Aufgabe und Fälligkeitstag an."); return; }
    S.store.tasks = [...(S.store.tasks || []), { id: rid(), title, min, due, dueTime: /^\d{2}:\d{2}$/.test(tim) ? tim : "", done: false, eid: null }];
    persist(); recompute(); render(); toast(`Aufgabe „${title}“ eingetragen.`);
  }
  if (f.dataset.form === "cmd") { runCommand(); return; }
  if (f.dataset.form === "test") {
    const subject = $("#test-subj").value.trim(), date = $("#test-date").value;
    if (!subject || !/^\d{4}-\d{2}-\d{2}$/.test(date)) { toast("Gib Fach und Datum an."); return; }
    if (!S.mcp || !S.eventsLoaded) { toast("Der Kalender ist noch nicht geladen."); return; }
    guarded(async () => {
      let eid = null;
      try {
        const d = ymdToDate(date);
        const p = await call("create_event", {
          summary: `Test: ${subject}`, allDay: true, startTime: localISO(d, 0), endTime: localISO(addDays(d, 1), 0),
          availability: "AVAILABILITY_FREE", colorId: META.test.color, description: "[tagwerk:test]\nEingetragen mit Cursus",
          overrideReminders: [{ method: "popup", minutes: 360 }]
        });
        eid = (p && (p.id || (p.event && p.event.id))) || null;
      } catch (e) { writeFailed(e); await loadWeek(); return; }
      S.store.tests = [...(S.store.tests || []), { id: rid(), subject, date, eid }];
      await persist(); toast(`Test ${subject} eingetragen.`);
      await loadWeek();
    });
  }
  if (f.dataset.form === "geb") {
    const name = $("#geb-name").value.trim(), date = $("#geb-date").value;
    if (!name || !/^\d{4}-\d{2}-\d{2}$/.test(date)) { toast("Gib Name und Datum an."); return; }
    if (!S.mcp || !S.eventsLoaded) { toast("Der Kalender ist noch nicht geladen."); return; }
    const n = nextOcc(date);
    guarded(async () => {
      let eid = null;
      try {
        const p = await call("create_event", {
          summary: `Geburtstag: ${name}`, allDay: true, startTime: localISO(n, 0), endTime: localISO(addDays(n, 1), 0),
          recurrenceData: ["RRULE:FREQ=YEARLY"], availability: "AVAILABILITY_FREE", colorId: META.geb.color,
          description: "[tagwerk:geb]\nEingetragen mit Cursus",
          overrideReminders: [{ method: "popup", minutes: 9000 }, { method: "popup", minutes: 360 }]
        });
        eid = (p && (p.id || (p.event && p.event.id))) || null;
      } catch (e) { writeFailed(e); await loadWeek(); return; }
      S.store.birthdays = [...(S.store.birthdays || []), { id: rid(), name, date, eid }];
      await persist(); toast(`Geburtstag von ${name} eingetragen.`);
      await loadWeek();
    });
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset && el.dataset.book) { S.store.books[el.dataset.book] = el.value.trim(); persist(); recompute(); renderGrid(); }
});
document.addEventListener("focusout", () => { setTimeout(() => { if (S.sidePending) renderSide(); }, 0); });

const mq = window.matchMedia("(max-width: 760px)");
S.single = mq.matches;
const onMq = () => { S.single = mq.matches; renderGrid(); };
if (mq.addEventListener) mq.addEventListener("change", onMq); else if (mq.addListener) mq.addListener(onMq);
setInterval(() => { if (!S.sheet) renderGrid(); }, 60000);

render();

use("db").then(db => {
  if (!db) { S.dbOff = true; renderHeader(); return; }
  S.ref = db.doc("tagwerk/state");
  S.ref.onSnapshot(snap => {
    if (snap.metadata && snap.metadata.hasPendingWrites) return;
    S.store = snap.exists ? merge(clone(DEFAULT_STORE), clone(snap.data())) : clone(DEFAULT_STORE);
    const first = !S.storeLoaded;
    S.storeLoaded = true; recompute(); render(); scheduleMirror();
    if (first && S.eventsLoaded && !S.pastChecked) loadWeek();
  }, err => { toast(dbErrText(err)); });
  S.planRef = db.doc("tagwerk/plan");
  S.planReady = S.planRef.get().then(s => { if (s.exists) { const d = clone(s.data()); S.planDays = d.days || {}; S.planJson = JSON.stringify(S.planDays); } }).catch(() => {});
  if (S.eventsLoaded && !S.calErr) { syncPlan(); syncEvents(); }
  db.doc("tagwerk/weather").onSnapshot(snap => {
    S.weather = snap.exists ? clone(snap.data()) : null;
    recompute(); render();
  }, () => {});
}).catch(() => { S.dbOff = true; renderHeader(); });

/* ---------- Befehlszeile ---------- */
use("sample").then(fn => { if (fn) { S.sample = fn; const f = $("#cmd"); if (f) f.hidden = false; } }).catch(() => {});
function compactEvents(list) {
  return list.filter(e => !e.allDay || e.type === "test" || e.birthday).map(e => ({
    id: e.id, titel: cleanTitle(e.title), typ: e.type || "termin", tag: ymd(e.start),
    von: e.allDay ? "ganztägig" : hhmm(minOfDay(e.start)), bis: e.allDay ? "" : hhmm(minOfDay(e.end)), vorbei: e.end <= new Date()
  }));
}
function cmdPrompt(text) {
  const st = S.store, s = st.settings, now = new Date();
  const school = [0, 1, 2, 3, 4].filter(i => s.school[String(i)]).map(i => `${DLONG[i]} ${s.school[String(i)][0]}–${s.school[String(i)][1]}`).join(", ") || "keine eingetragen";
  const types = Object.entries(META).filter(([k]) => !["geb", "test"].includes(k)).map(([k, m]) => `${k} = ${m.label}`).join(", ");
  return `Du bist die Planungshilfe in Cursus, dem Wochenplaner ${window.__PUBLICA__ ? "des Nutzers" : "von David"}. Er tippt eine Änderung in einem Satz, oft knapp oder mit Tippfehlern. Führe sie mit den Werkzeugen direkt aus, ohne Rückfrage, außer der Wunsch ist wirklich unklar oder würde mehr als drei Blöcke löschen.

Jetzt: ${DLONG[(now.getDay() + 6) % 7]}, ${ymd(now)}, ${hhmm(minOfDay(now))} Uhr, Zeitzone Europe/Berlin.
${window.__PUBLICA__ ? `Regeln der Planung: Schule ${school}. ${s.buffer} min Pause zwischen Blöcken. Der letzte Block endet um ${s.dayEnd}. Wochenende ab ${s.weekendStart}. Blöcke in der Vergangenheit nicht verändern.` : `Regeln seiner Planung: Schule ${school}. Nach der Schule 30 min bis zu Hause. Fußweg Wohnung–Bibliothek 30 min (Mo–Sa), Bibliothek–Gym 15 min, Gym–Wohnung 30 min. Gym am liebsten direkt nach der Bibliothek, sonst davor. Höchstens eine Lernzeit pro Tag. 15 min Pause zwischen Blöcken. Der letzte Block endet um 23:00, danach Sekundärbuch. Wochenende ab 08:00. Blöcke in der Vergangenheit nicht verändern.`}
Blocktypen: ${types}. Für etwas ohne Typ (Abgabe, Arzt, Treffen) nimm typ "termin".
Wenn du einen Block verschiebst und dadurch andere am selben Tag kollidieren, schieb die anderen mit, statt sie zu überlappen.
Eine Hausaufgabe oder Erledigung mit Frist, aber ohne feste Uhrzeit, legst du mit add_task an; Cursus plant sie dann selbst ein.

Blöcke der angezeigten Woche (${ymd(S.weekStart)} bis ${ymd(addDays(S.weekStart, 6))}):
${JSON.stringify(compactEvents(S.events))}
Offene Aufgaben: ${JSON.stringify((st.tasks || []).filter(t => !t.done).map(t => ({ titel: t.title, min: t.min, fällig: t.due })))}
Für andere Tage hole die Blöcke mit list_blocks.

Antworte zum Schluss in einem bis drei kurzen Sätzen auf Deutsch, was du geändert hast. Keine Aufzählung, keine Rückfrage, wenn alles erledigt ist.

Davids Wunsch: ${text}`;
}
const CMD_TOOLS = () => [
  { name: "list_blocks", description: "Listet alle Kalendereinträge von Tag 'von' bis Tag 'bis' (je JJJJ-MM-TT, höchstens 14 Tage) mit id, titel, typ, tag, von, bis.",
    inputSchema: { type: "object", properties: { von: { type: "string" }, bis: { type: "string" } }, required: ["von", "bis"] },
    async execute(i) {
      const a = ymdToDate(String(i.von)), b = addDays(ymdToDate(String(i.bis)), 1);
      if ((b - a) / 864e5 > 15) throw new Error("Höchstens 14 Tage auf einmal.");
      const evs = await listAll({ startTime: localISO(a, 0), endTime: localISO(b, 0) });
      return compactEvents(evs.map(parseEvent).filter(Boolean));
    } },
  { name: "move_block", description: "Verschiebt einen Eintrag per id auf einen neuen Tag und neue Uhrzeiten (von/bis als HH:MM). Gibt 'ok' zurück.",
    inputSchema: { type: "object", properties: { id: { type: "string" }, tag: { type: "string" }, von: { type: "string" }, bis: { type: "string" } }, required: ["id", "tag", "von", "bis"] },
    async execute(i) {
      const d = ymdToDate(String(i.tag)), a = toMin(String(i.von)), b = toMin(String(i.bis));
      if (!(b > a)) throw new Error("bis muss nach von liegen.");
      await call("update_event", { eventId: String(i.id), startTime: localISO(d, a), endTime: localISO(d, b), notificationLevel: "NONE" });
      cmdLog(`verschoben: ${i.id.slice(0, 6)}… auf ${i.tag} ${i.von}–${i.bis}`); return "ok";
    } },
  { name: "delete_block", description: "Löscht einen Eintrag per id endgültig. Nur benutzen, wenn David das Weglassen ausdrücklich will.",
    inputSchema: { type: "object", properties: { id: { type: "string" }, titel: { type: "string" } }, required: ["id"] },
    async execute(i) {
      const ev = S.events.find(e => e.id === String(i.id));
      await call("delete_event", { eventId: String(i.id), notificationLevel: "NONE" });
      if (ev && ev.type === "task" && ev.taskId) { const t = (S.store.tasks || []).find(x => x.id === ev.taskId); if (t) t.eid = null; }
      cmdLog(`gelöscht: ${i.titel || (ev ? cleanTitle(ev.title) : i.id)}`); return "ok";
    } },
  { name: "create_block", description: "Legt einen Block an. typ = einer der Blocktypen oder 'termin'; tag JJJJ-MM-TT; von/bis HH:MM; titel nur bei 'termin' oder für einen Zusatz; notiz optional.",
    inputSchema: { type: "object", properties: { typ: { type: "string" }, tag: { type: "string" }, von: { type: "string" }, bis: { type: "string" }, titel: { type: "string" }, notiz: { type: "string" } }, required: ["typ", "tag", "von", "bis"] },
    async execute(i) {
      const d = ymdToDate(String(i.tag)), a = toMin(String(i.von)), b = toMin(String(i.bis)), typ = String(i.typ);
      if (!(b > a)) throw new Error("bis muss nach von liegen.");
      if (META[typ] && !["geb", "test", "task"].includes(typ)) {
        if (i.titel || i.notiz) {
          await call("create_event", { summary: `${summaryFor(typ)}${i.titel ? " · " + i.titel : ""}`, startTime: localISO(d, a), endTime: localISO(d, b),
            description: `[tagwerk:${typ}]\n${i.notiz || ""}\nEingeplant mit Cursus`, colorId: META[typ].color, overrideReminders: [{ method: "popup", minutes: +S.store.settings.remind || 5 }] });
        } else await createBlock(typ, d, a, b - a);
      } else {
        await call("create_event", { summary: String(i.titel || "Termin"), startTime: localISO(d, a), endTime: localISO(d, b), description: String(i.notiz || ""), overrideReminders: [{ method: "popup", minutes: +S.store.settings.remind || 5 }] });
      }
      cmdLog(`neu: ${i.titel || (META[typ] ? META[typ].label : "Termin")} ${i.tag} ${i.von}–${i.bis}`); return "ok";
    } },
  { name: "add_task", description: "Legt eine Aufgabe mit Dauer in Minuten und Fälligkeitstag an (optional frist_uhrzeit HH:MM). Cursus plant sie danach selbst in eine Lücke vor der Frist.",
    inputSchema: { type: "object", properties: { titel: { type: "string" }, minuten: { type: "number" }, faellig: { type: "string" }, frist_uhrzeit: { type: "string" } }, required: ["titel", "minuten", "faellig"] },
    async execute(i) {
      S.store.tasks = [...(S.store.tasks || []), { id: rid(), title: String(i.titel), min: Math.max(15, Number(i.minuten) || 60), due: String(i.faellig), dueTime: /^\d{2}:\d{2}$/.test(String(i.frist_uhrzeit || "")) ? String(i.frist_uhrzeit) : "", done: false, eid: null }];
      await persist(); cmdLog(`Aufgabe: ${i.titel}, fällig ${i.faellig}`); return "ok, Cursus schlägt dafür gleich einen Platz vor";
    } },
  { name: "skip_type_on_day", description: "Sperrt einen Blocktyp an einem Tag, damit Cursus dort keinen neuen Vorschlag dafür macht (z. B. heute kein Gym).",
    inputSchema: { type: "object", properties: { typ: { type: "string" }, tag: { type: "string" } }, required: ["typ", "tag"] },
    async execute(i) {
      const set = S.store.settings; set.skip = set.skip || {};
      const k = String(i.tag), l = Array.isArray(set.skip[k]) ? set.skip[k] : [];
      if (!l.includes(String(i.typ))) l.push(String(i.typ)); set.skip[k] = l;
      await persist(); cmdLog(`gesperrt: ${i.typ} am ${k}`); return "ok";
    } }
];
function cmdLog(line) { (S.cmdActs = S.cmdActs || []).push(line); cmdShow(); }
function cmdShow(text) {
  const o = $("#cmd-out"); o.hidden = false;
  if (text !== undefined) S.cmdText = text;
  o.innerHTML = `${esc(S.cmdText || "")}${(S.cmdActs || []).map(a => `<span class="act">${esc(a)}</span>`).join("")}`;
}
function cmdErr(e) {
  switch (e && e.code) {
    case "cancelled": return "Abgebrochen. Was schon geändert war, bleibt.";
    case "not_granted": case "sampling_disabled": case "capability_disabled": case "capability_removed": case "not_declared": return "Die Befehlszeile ist in dieser Ansicht nicht erlaubt. Ändere den Plan über die Blöcke oder im Chat.";
    case "tools_unavailable": return "Diese Ansicht kann keine Änderungen ausführen. Öffne Cursus in claude.ai.";
    case "rate_limited": return "Gerade zu viele Anfragen. Versuch es in ein paar Minuten noch einmal.";
    case "session_expired": return "Bitte melde dich bei claude.ai neu an.";
    case "refused": return "Das kann ich so nicht ausführen. Formuliere es anders.";
    default: return "Das hat nicht geklappt. Versuch es noch einmal.";
  }
}
async function runCommand() {
  const inp = $("#cmd-in"), text = inp.value.trim();
  if (!text || !S.sample || S.cmdBusy) return;
  if (!S.mcp || !S.eventsLoaded) { toast("Der Kalender ist noch nicht geladen."); return; }
  S.cmdBusy = true; S.cmdActs = []; S.cmdCtl = new AbortController();
  $("#cmd-go").disabled = true; $("#cmd-stop").hidden = false; cmdShow("Denke nach …");
  let got = false;
  try {
    const r = await S.sample(cmdPrompt(text), { tools: CMD_TOOLS(), signal: S.cmdCtl.signal, onText: ({ text: t }) => { got = true; cmdShow(t.trim().split(/\n\s*\n/).at(-1)); } });
    cmdShow(r.text.trim().split(/\n\s*\n/).at(-1));
    inp.value = "";
  } catch (e) {
    cmdShow(((e && e.text) ? e.text.trim().split(/\n\s*\n/).at(-1) + "\n" : "") + cmdErr(e));
    if (e && ["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(e.code)) S.sample = null;
  } finally {
    S.cmdBusy = false; $("#cmd-go").disabled = false; $("#cmd-stop").hidden = true;
    if ((S.cmdActs || []).length) await loadWeek();
  }
}

try { S.sideTab = localStorage.getItem("tagwerk.sideTab") || "soll"; } catch (_) { S.sideTab = "soll"; }
/* Abgleich mit anderen Geräten: beim Zurückkehren und alle zwei Minuten */
let lastPoll = Date.now();
function refresh(force) {
  if (!S.mcp || S.busy || S.sheet || S.cmdBusy || document.hidden) return;
  if (!force && Date.now() - lastPoll < 30e3) return;
  lastPoll = Date.now(); TW.poll(); loadWeek();
}
document.addEventListener("visibilitychange", () => refresh(false));
window.addEventListener("focus", () => refresh(false));
setInterval(() => refresh(true), 120e3);
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
use("mcp").then(m => {
  if (!m) { S.calErr = { code: "no_sync" }; render(); return; }
  S.mcp = m; loadWeek(); scheduleMirror();
}).catch(() => { S.calErr = { code: "capability_disabled" }; render(); });
})();
</script>
